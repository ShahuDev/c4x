<ng-container *ngIf="post; else missing">
  <section class="post-hero">
    <div class="wrap">
      <a routerLink="/blog" class="back">&larr; Back to blog</a>
      <div class="tags">
        <span class="tag" *ngFor="let tag of post.tags">{{ tag }}</span>
      </div>
      <h1>{{ post.title }}</h1>
      <div class="meta">{{ post.date | date:'MMM d, y' }} &middot; {{ post.author }}</div>
    </div>
  </section>

  <section class="post-body">
    <div class="wrap">
      <div class="cover"><img [src]="post.coverImage" [alt]="post.title" /></div>
      <article>
        <p *ngFor="let para of post.content">{{ para }}</p>
      </article>
    </div>
  </section>
</ng-container>

<ng-template #missing>
  <section class="post-missing">
    <div class="wrap">
      <h1>Post not found</h1>
      <p>This article may have been moved or removed.</p>
      <a routerLink="/blog" class="cta-btn">&larr; Back to blog</a>
    </div>
  </section>
</ng-template>
